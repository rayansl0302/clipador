name: clip-studio

x-app-env: &app-env
  CLIP_ENV: development
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://clip:clip@postgres:5432/clipstudio}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clip}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clipsecret}
  S3_BUCKET: ${S3_BUCKET:-clip-studio}
  S3_REGION: ${S3_REGION:-us-east-1}
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-7200}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-local}
  TRANSCRIBE_MAX_BYTES: ${TRANSCRIBE_MAX_BYTES:-20000000}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
  FASTER_WHISPER_MODEL: ${FASTER_WHISPER_MODEL:-base}
  LOCAL_CHUNK_SECONDS: ${LOCAL_CHUNK_SECONDS:-600}
  LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  POSTIZ_URL: ${POSTIZ_URL:-}
  POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clip}
      POSTGRES_DB: ${POSTGRES_DB:-clipstudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clip} -d ${POSTGRES_DB:-clipstudio}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-clip}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-clipsecret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clip}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clipsecret}
      S3_BUCKET: ${S3_BUCKET:-clip-studio}
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    volumes:
      - ./infra/minio/create-bucket.sh:/create-bucket.sh:ro
    restart: "no"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2"]
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - ./apps/api:/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
  web_next:
